name: Deploy wedding site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --production=false --non-interactive

      - name: Export wedding content for static hosting
        run: |
          python - <<'PY'
          import json
          import runpy
          from pathlib import Path

          content = runpy.run_path("backend/content.py")["CONTENT"]
          out = Path("frontend/public/content.json")
          out.write_text(json.dumps(content, ensure_ascii=False, indent=2), encoding="utf-8")
          PY

      - name: Build static site
        working-directory: frontend
        env:
          PUBLIC_URL: /
          REACT_APP_SITE_PHASE: save-the-date
          CI: "false"
        run: yarn build

      - name: Add SPA fallback
        run: |
          cp frontend/build/index.html frontend/build/404.html
          touch frontend/build/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
